services:
  postgres:
    image: postgres:16-alpine
    container_name: unitmrw_db
    environment:
      POSTGRES_DB: unitmrw_db
      POSTGRES_USER: uniuser_db
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: